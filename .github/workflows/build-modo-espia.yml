name: Build Modo Espia APK

on:
  workflow_dispatch:
  push:
    branches: [ modo-espia-apk ]
    paths:
      - 'modo-espia/**'
      - '.github/workflows/build-modo-espia.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: modo-espia
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp modo-espia/app/build/outputs/apk/debug/app-debug.apk MODO-ESPIA-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MODO-ESPIA-APK
          path: MODO-ESPIA-v1.apk
          if-no-files-found: error
