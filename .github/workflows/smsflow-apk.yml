name: Build SMS Flow APK

on:
  push:
    branches: [ "smsflow-apk" ]
    paths:
      - "smsflow/**"
      - ".github/workflows/smsflow-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: smsflow
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp smsflow/app/build/outputs/apk/debug/app-debug.apk SMSFlow.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSFlow-APK
          path: SMSFlow.apk
          if-no-files-found: error
